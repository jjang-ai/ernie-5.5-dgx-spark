[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ernie-5.5-dgx-spark"
version = "0.6.0"
description = "All-in-one 2x-4x NVIDIA DGX Spark (GB10, SM12.1) 1M-context runtime, custom SM12.1 kernels, 200GbE auto-discovery & CLI for ERNIE 5.5 Flash Preview (MXFP4 & W4A16_NVFP4)"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = []

[project.scripts]
spark-ernie = "spark_ernie_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["spark_ernie_runtime*", "kernels*"]

[tool.mutmut]
source_paths = ["spark_ernie_runtime"]
only_mutate = ["spark_ernie_runtime/sm120_attention.py"]
also_copy = ["kernels"]
pytest_add_cli_args = ["--disable-warnings", "-x"]
pytest_add_cli_args_test_selection = ["tests/test_sm120_attention.py"]
process_isolation = "forkserver"
forkserver_warmup = "none"
